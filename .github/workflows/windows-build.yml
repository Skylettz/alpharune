name: Build Riftbound for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CXX_STANDARD=20 `
            -DRIFTBOUND_BUILD_OPENSPIEL=ON `
            -DRIFTBOUND_BUILD_LIBTORCH=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target riftbound --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item build\Release\riftbound.exe package\

          Copy-Item decks package\decks -Recurse
          Copy-Item cards package\cards -Recurse
          Copy-Item rules package\rules -Recurse

          Compress-Archive -Path package\* -DestinationPath Riftbound-Windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Riftbound-Windows
          path: Riftbound-Windows.zip
