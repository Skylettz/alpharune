name: Build Riftbound for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies with vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install `
            boost-program-options:x64-windows `
            boost-filesystem:x64-windows `
            boost-system:x64-windows `
            boost-context:x64-windows `
            nlohmann-json:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target riftbound

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item build\Release\riftbound.exe package\

          Copy-Item decks package\decks -Recurse
          Copy-Item cards package\cards -Recurse
          Copy-Item rules package\rules -Recurse

          if (Test-Path vcpkg_installed\x64-windows\bin) {
            Copy-Item vcpkg_installed\x64-windows\bin\*.dll package\ -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path package\* -DestinationPath Riftbound-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Riftbound-Windows
          path: Riftbound-Windows.zip
